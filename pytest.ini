[pytest]
# Run from the repository folder with the project interpreter, e.g.:
#     ..\CassavaBase\part2\.venv\Scripts\python -m pytest
testpaths = tests
# "import run" / "import agents" find the app files (.); the test helpers live in tests/.
pythonpath = . tests

# Every marker must be registered here; an unknown marker is an error.
markers =
    live: talks to a real BrAPI server over the network. Excluded by default; run with: pytest -m live
    model: needs a running language model (local Ollama, or remote only if explicitly allowed). Excluded by default; run with: pytest -m model

# Default run = offline tests only. A -m given on the command line replaces this one.
addopts = --strict-markers -m "not live and not model"
